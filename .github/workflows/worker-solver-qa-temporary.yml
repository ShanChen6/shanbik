name: Worker solver browser QA
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  browser:
    if: github.head_ref == 'feature/task-9-3-worker-solver'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --prefix /tmp/shanbik-qa playwright@1.56.1 --no-audit --no-fund
      - run: node /tmp/shanbik-qa/node_modules/playwright/cli.js install chromium --only-shell
      - run: |
          pnpm start --hostname 127.0.0.1 --port 3179 >/tmp/worker-solver-server.log 2>&1 &
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:3179/practice >/dev/null && break; sleep 0.2; done
          node .qa/worker-solver-browser.mjs
