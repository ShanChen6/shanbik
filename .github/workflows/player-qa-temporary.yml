name: Player QA temporary
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  player:
    if: github.head_ref == 'feature/task-8-2-player-controls'
    name: Player QA temporary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format player files and export source
        run: node .qa/player-format.mjs
      - run: pnpm exec eslint src
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/player-qa" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/player-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser player checks
        run: |
          pnpm exec next start -H 127.0.0.1 -p 3172 > "$RUNNER_TEMP/player-server.log" 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/player-qa/node_modules/playwright/index.mjs"
          node .qa/player-browser.mjs
