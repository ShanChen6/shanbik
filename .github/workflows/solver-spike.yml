name: Solver spike benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix tools/solver-spike --ignore-scripts --no-audit --no-fund
      - run: node tools/solver-spike/node_modules/playwright/cli.js install chromium --only-shell
      - run: npm --prefix tools/solver-spike run bench
      - uses: actions/upload-artifact@v4
        with:
          name: solver-spike-report
          path: tools/solver-spike/output/report.json
          retention-days: 7
